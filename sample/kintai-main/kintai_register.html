<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>勤怠 - ユーザー登録</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.wrap { max-width: 400px; width: 100%; }
.card { background: #fff; border-radius: 20px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; text-align: center; }
p { font-size: 14px; color: #888; text-align: center; margin-bottom: 2rem; line-height: 1.6; }
label { font-size: 12px; color: #888; display: block; margin-bottom: 6px; }
input { width: 100%; padding: 14px 16px; border: 1.5px solid #ddd; border-radius: 12px; font-size: 16px; margin-bottom: 1rem; }
input:focus { outline: none; border-color: #1D9E75; }
.btn { width: 100%; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; background: #1D9E75; color: #fff; }
.btn:active { opacity: 0.8; }
.result { margin-top: 1.5rem; display: none; }
.result-label { font-size: 12px; color: #888; margin-bottom: 8px; }
.url-box { background: #f5f5f0; border-radius: 12px; padding: 14px; font-size: 13px; color: #1a1a1a; word-break: break-all; margin-bottom: 1rem; }
.btn-copy { background: #378ADD; color: #fff; font-size: 14px; padding: 12px; }
.msg { font-size: 13px; color: #888; text-align: center; margin-top: 1rem; line-height: 1.6; }
.status { padding: 12px; border-radius: 12px; font-size: 14px; text-align: center; display: none; margin-bottom: 1rem; }
.status.error { background: #faece7; color: #993c1d; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>勤怠打刻</h1>
    <p>名前を入力して登録すると<br>あなた専用のURLが発行されます。</p>

    <div class="status" id="status"></div>

    <div id="form-area">
      <label>名前</label>
      <input type="text" id="name-input" placeholder="例: 若山直樹">
      <button class="btn" onclick="register()">登録 / URLを確認する</button>
    </div>

    <div class="result" id="result">
      <div class="result-label">あなた専用のURLはこちらです</div>
      <div class="url-box" id="url-box"></div>
      <button class="btn btn-copy" onclick="copyUrl()">URLをコピーする</button>
      <p class="msg">このURLをホーム画面に追加してください。<br>次回からはこのURLを開くだけでOKです。</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://orkwjindnxjkaplsbcdb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_selWw3fEQWrExooHJZTt_w_7OKkA3hQ';
const BASE_URL = 'https://naokstarider2624114-art.github.io/kintai/kintai.html';

function generateToken() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let token = '';
  for (let i = 0; i < 16; i++) token += chars[Math.floor(Math.random() * chars.length)];
  return token;
}

async function sbFetch(path, options = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...options.headers
    }
  });
  if (res.status === 204) return null;
  return res.json();
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status error';
  el.style.display = 'block';
}

async function register() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) { showStatus('名前を入力してください'); return; }

  // 既存ユーザーを確認
  const existing = await sbFetch(`users?name=eq.${encodeURIComponent(name)}&select=token`);
  
  let token;
  if (existing && existing.length > 0) {
    // 既存ユーザー → 同じURLを返す
    token = existing[0].token;
  } else {
    // 新規ユーザー → トークンを生成して登録
    token = generateToken();
    await sbFetch('users', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ name, token })
    });
  }

  const url = BASE_URL + '?token=' + token;
  document.getElementById('url-box').textContent = url;
  document.getElementById('result').style.display = 'block';
  document.getElementById('status').style.display = 'none';
}

function copyUrl() {
  const url = document.getElementById('url-box').textContent;
  navigator.clipboard.writeText(url).then(() => {
    alert('コピーしました！');
  });
}
</script>
</body>
</html>
