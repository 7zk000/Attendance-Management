<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>勤怠管理</title>
  <link rel="stylesheet" href="style/manage.css">
</head>
<body>
  <div id="admin-login-screen" class="container hidden">
    <div class="card" style="max-width: 360px; margin: 5rem auto; padding: 2rem;">
      <p class="eyebrow">管理者ログイン</p>
      <h1 style="margin: 0.5rem 0 1rem; font-size: 1.6rem;">勤怠管理画面</h1>
      <label for="admin-token" style="display:block; margin-bottom: 0.5rem; color:#666;">管理者コード</label>
      <input id="admin-token" type="password" placeholder="管理者コードを入力" style="width:100%; padding: 0.75rem; border:1px solid #dfe3ea; border-radius:10px; margin-bottom:1rem;" />
      <button id="admin-login-btn" class="btn btn-primary" type="button">ログイン</button>
      <p id="admin-login-error" style="display:none; color:#b42318; margin-top: 0.75rem; font-size:0.9rem;">管理者コードが違います。</p>
    </div>
  </div>

  <div id="admin-content" class="container hidden">
    <header class="header">
      <div>
        <p class="eyebrow">管理画面</p>
        <h1>ユーザー稼働時間一覧</h1>
      </div>
      <div class="header-actions">
        <label class="month-picker">
          <span>対象月</span>
          <input id="month-input" type="month" />
        </label>
        <button id="reload-btn" class="btn btn-primary" type="button">更新</button>
      </div>
    </header>

    <div class="summary-grid">
      <div class="card summary-card">
        <div class="label">対象月</div>
        <div class="value" id="month-label">-</div>
      </div>
      <div class="card summary-card">
        <div class="label">今月の営業日</div>
        <div class="value" id="business-days">-</div>
      </div>
      <div class="card summary-card">
        <div class="label">残りの営業日</div>
        <div class="value" id="remaining-business-days">-</div>
      </div>
    </div>

    <div class="card table-card">
      <div class="table-header">
        <h2>稼働時間一覧</h2>
      </div>

      <div id="loading" class="loading">読み込み中...</div>

      <div id="table-wrap" class="table-wrap hidden">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>ユーザ名</th>
              <th>稼働時間</th>
              <th>出勤日数</th>
              <th>休みの数</th>
              <th>一日平均の稼働時間</th>
              <th>200hまで残り何時間か</th>
              <th>勤怠一覧</th>
            </tr>
          </thead>
          <tbody id="summary-body"></tbody>
        </table>
      </div>
    </div>

    <div id="user-detail" class="card detail-card hidden">
      <div class="detail-header">
        <div>
          <p class="eyebrow">個人勤怠</p>
          <h2 id="detail-title">-</h2>
        </div>
        <button id="back-to-summary-btn" class="btn btn-secondary" type="button">一覧に戻る</button>
      </div>
      <div id="detail-loading" class="loading">読み込み中...</div>
      <div id="detail-table-wrap" class="table-wrap hidden">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>出勤時刻</th>
              <th>退勤時刻</th>
              <th>稼働時間</th>
              <th>理由</th>
            </tr>
          </thead>
          <tbody id="detail-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    window.SUPABASE_URL = 'https://fepmlhggkmdfhcfcyuxi.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_ccPWCQ40MjmvRAR4w8SefA_RW3AQ_37';
  </script>
  <script src="scripts/manage.js?v=20260819d"></script>
</body>
</html>
